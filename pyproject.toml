[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lpspell"
version = "0.1.0"
description = "A spell checker that reads the whole sentence: catches form when you meant from."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "symspellpy>=6.7",
    "wordfreq>=3.1",
]

[project.optional-dependencies]
# Hugging Face models (the default, Qwen/Qwen2.5-0.5B)
hf = ["torch>=2.3", "transformers>=4.45", "accelerate>=1.0"]
# GGUF files through llama.cpp
llama = ["llama-cpp-python>=0.3", "numpy"]
dev = ["pytest>=8"]

[project.scripts]
lpspell = "lpspell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
